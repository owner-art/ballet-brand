# video-insight 렌즈 — 이 프로젝트 입장에서 영상을 어떻게 볼 것인가
name = "발레 레이어링 브랜드"
language = "ko"
notes_dir = "research/videos"

description = """
발레의 훈련 문화(몸을 데우고 가리기 위해 '걸치는' 옷)에서 출발한 레이어링 라이프스타일 브랜드.
발레복을 만들지 않는다. 랩스커트·워밍업 팬츠·볼레로/크롭 가디건·레그워머·힙스카프 다섯 겹을
연습실 밖 일상복으로 낸다. 발레코어(리본·파스텔 핑크) 트렌드는 지났다고 보고 기대지 않는다.
진입 시장은 세 개의 문: 발레(신뢰의 출처), 일상 레이어(규모), 라인댄스(별도 라인).
가을이 발레 수요와 보온 수요가 겹치는 창이다.
"""

questions = [
  "영상 속 사람들은 레오타드·타이즈 위에 무엇을, 왜 걸치는가? (보온 / 가림 / 멋 중 무엇이 동기인가)",
  "다섯 겹(랩스커트, 워밍업 팬츠, 볼레로·크롭 가디건, 레그워머, 힙스카프) 중 무엇이 등장하고, 연습실 밖에서도 입히는가?",
  "성인 취미 발레인의 연령·동기·불편함에 대한 신호는 무엇인가?",
  "언급되거나 보이는 브랜드·가격대·구매 채널은 무엇인가?",
  "발레코어(리본·핑크) 미감에 기대는가, 훈련·기능의 미감인가? 우리 포지셔닝을 지지하는가 반박하는가?",
  "계절·온도·부상 예방에 대한 언급이 있는가?",
  "이 영상의 형식·훅에서 우리 콘텐츠가 빌릴 수 있는 것은 무엇인가?",
]

